apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-conf
  namespace: lab01
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;

      location / {
        try_files $uri $uri/ =404
      }

      location /healthz {
        access_log off;
        return 200 'ok';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: lab01
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: storefront-conf
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: lab01
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 8080
